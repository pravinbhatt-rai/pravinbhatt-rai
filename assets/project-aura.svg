<svg xmlns="http://www.w3.org/2000/svg" width="420" height="310" viewBox="0 0 420 310" role="img" aria-label="Project 04. Aura, an AI-powered intelligent application. FastAPI and Next.js architecture, PostgreSQL, Redis and Qdrant integration, GitHub OAuth and graph-based data modeling, Docker-based infrastructure and CI/CD, model routing, latency, cost and hallucination evaluation. Stack: Python, FastAPI, Next.js, PostgreSQL, Redis, Qdrant, Docker.">
  <title>Aura</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#00f7ff"/>
    </linearGradient>
    <linearGradient id="bgc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1626"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
  </defs>
  <style>
    text{font-family:'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
    .run{stroke-dasharray:140 860;animation:run 6s linear infinite}
    @keyframes run{to{stroke-dashoffset:-1000}}
    .num{font-size:11px;letter-spacing:3px;fill:#7a8aa8}
    .ttl{font-size:17px;font-weight:700;fill:#e6f1ff;letter-spacing:.5px}
    .sub{font-size:12px;fill:#00f7ff}
    .b{opacity:0;animation:in .6s ease-out both}
    @keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
    .bt{font-size:12px;fill:#c9d6ee}
    .lab{font-size:10px;letter-spacing:2px;fill:#7a8aa8}
    .stk{font-size:11.5px;fill:#9fb0cf}
    .core{animation:core 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    @keyframes core{from{transform:scale(.8)}to{transform:scale(1.25)}}
  </style>
  <rect x="1" y="1" width="418" height="308" rx="16" fill="url(#bgc)" stroke="#1c2740"/>
  <rect x="1" y="1" width="418" height="308" rx="16" fill="none" stroke="url(#edge)" stroke-width="2" pathLength="1000" class="run"/>

  <text class="num" x="24" y="34">04 / PROJECT</text>
  <text class="ttl" x="24" y="62">AURA</text>
  <text class="sub" x="24" y="84">AI-Powered Intelligent Application</text>

  <circle cx="360" cy="43" r="18" fill="none" stroke="#00f7ff" stroke-opacity=".35" stroke-dasharray="3 5"/>
  <circle cx="360" cy="43" r="28" fill="none" stroke="#ff4fd8" stroke-opacity=".35"/>
  <circle class="core" cx="360" cy="43" r="6" fill="#7c5cff"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 360 43" to="360 360 43" dur="6s" repeatCount="indefinite"/>
    <circle cx="378" cy="43" r="3.5" fill="#00f7ff"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 360 43" to="0 360 43" dur="9s" repeatCount="indefinite"/>
    <circle cx="388" cy="43" r="3" fill="#ff4fd8"/>
  </g>

  <line x1="24" y1="100" x2="396" y2="100" stroke="#1c2740"/>

  <g class="b" style="animation-delay:.3s"><path d="M28 118l6 4-6 4z" fill="#ff4fd8"/><text class="bt" x="44" y="127">FastAPI and Next.js architecture</text></g>
  <g class="b" style="animation-delay:.6s"><path d="M28 141l6 4-6 4z" fill="#ff4fd8"/><text class="bt" x="44" y="150">PostgreSQL, Redis and Qdrant integration</text></g>
  <g class="b" style="animation-delay:.9s"><path d="M28 164l6 4-6 4z" fill="#ff4fd8"/><text class="bt" x="44" y="173">GitHub OAuth and graph-based data modeling</text></g>
  <g class="b" style="animation-delay:1.2s"><path d="M28 187l6 4-6 4z" fill="#ff4fd8"/><text class="bt" x="44" y="196">Docker-based infrastructure and CI/CD</text></g>
  <g class="b" style="animation-delay:1.5s"><path d="M28 210l6 4-6 4z" fill="#ff4fd8"/><text class="bt" x="44" y="219">Model routing, latency, cost, hallucination evals</text></g>

  <line x1="24" y1="232" x2="396" y2="232" stroke="#1c2740"/>
  <text class="lab" x="24" y="250">STACK</text>
  <text class="stk" x="24" y="268">Python &#183; FastAPI &#183; Next.js &#183; PostgreSQL</text>
  <text class="stk" x="24" y="286">Redis &#183; Qdrant &#183; Docker</text>
</svg>

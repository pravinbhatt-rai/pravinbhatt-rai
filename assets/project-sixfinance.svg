<svg xmlns="http://www.w3.org/2000/svg" width="420" height="310" viewBox="0 0 420 310" role="img" aria-label="Project 01. Six Finance, an AI-powered financial platform. Full-stack architecture built from scratch, RAG-based loan recommendation engine, backend APIs and database workflows, data retrieval, processing and API performance. Stack: Full Stack Development, Python, APIs, Databases, RAG, LLMs. Live at sixfinance.app.">
  <title>Six Finance</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f7ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="bgc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1626"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
  </defs>
  <style>
    text{font-family:'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
    .run{stroke-dasharray:140 860;animation:run 6s linear infinite}
    @keyframes run{to{stroke-dashoffset:-1000}}
    .num{font-size:11px;letter-spacing:3px;fill:#7a8aa8}
    .ttl{font-size:17px;font-weight:700;fill:#e6f1ff;letter-spacing:.5px}
    .sub{font-size:12px;fill:#00f7ff}
    .b{opacity:0;animation:in .6s ease-out both}
    @keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
    .bt{font-size:12px;fill:#c9d6ee}
    .lab{font-size:10px;letter-spacing:2px;fill:#7a8aa8}
    .stk{font-size:11.5px;fill:#9fb0cf}
    .pulse{animation:pulse 1.6s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.25}}
  </style>
  <rect x="1" y="1" width="418" height="308" rx="16" fill="url(#bgc)" stroke="#1c2740"/>
  <rect x="1" y="1" width="418" height="308" rx="16" fill="none" stroke="url(#edge)" stroke-width="2" pathLength="1000" class="run"/>

  <text class="num" x="24" y="34">01 / PROJECT</text>
  <text class="ttl" x="24" y="62">SIX FINANCE</text>
  <text class="sub" x="24" y="84">AI-Powered Financial Platform</text>

  <rect x="324" y="14" width="72" height="22" rx="11" fill="#3dffa0" fill-opacity=".12" stroke="#3dffa0"/>
  <circle cx="338" cy="25" r="3.5" fill="#3dffa0" class="pulse"/>
  <text x="347" y="29" font-size="11" font-weight="700" fill="#3dffa0">LIVE</text>
  <rect x="330" y="56" width="9" height="16" rx="2" fill="#00f7ff"><animate attributeName="height" values="16;28;12;16" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="56;44;60;56" dur="2.4s" repeatCount="indefinite"/></rect>
  <rect x="344" y="48" width="9" height="24" rx="2" fill="#00f7ff" fill-opacity=".85"><animate attributeName="height" values="24;14;30;24" dur="2.9s" repeatCount="indefinite"/><animate attributeName="y" values="48;58;42;48" dur="2.9s" repeatCount="indefinite"/></rect>
  <rect x="358" y="52" width="9" height="20" rx="2" fill="#7c5cff"><animate attributeName="height" values="20;30;16;20" dur="2.1s" repeatCount="indefinite"/><animate attributeName="y" values="52;42;56;52" dur="2.1s" repeatCount="indefinite"/></rect>
  <rect x="372" y="44" width="9" height="28" rx="2" fill="#7c5cff" fill-opacity=".85"><animate attributeName="height" values="28;18;26;28" dur="3.2s" repeatCount="indefinite"/><animate attributeName="y" values="44;54;46;44" dur="3.2s" repeatCount="indefinite"/></rect>
  <rect x="386" y="54" width="9" height="18" rx="2" fill="#ff4fd8"><animate attributeName="height" values="18;30;14;18" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y" values="54;42;58;54" dur="2.6s" repeatCount="indefinite"/></rect>

  <line x1="24" y1="100" x2="396" y2="100" stroke="#1c2740"/>

  <g class="b" style="animation-delay:.3s"><path d="M28 118l6 4-6 4z" fill="#00f7ff"/><text class="bt" x="44" y="127">Full-stack architecture, built from scratch</text></g>
  <g class="b" style="animation-delay:.6s"><path d="M28 141l6 4-6 4z" fill="#00f7ff"/><text class="bt" x="44" y="150">RAG-based loan recommendation engine</text></g>
  <g class="b" style="animation-delay:.9s"><path d="M28 164l6 4-6 4z" fill="#00f7ff"/><text class="bt" x="44" y="173">Backend APIs and database workflows</text></g>
  <g class="b" style="animation-delay:1.2s"><path d="M28 187l6 4-6 4z" fill="#00f7ff"/><text class="bt" x="44" y="196">Data retrieval, processing &amp; API performance</text></g>

  <line x1="24" y1="232" x2="396" y2="232" stroke="#1c2740"/>
  <text class="lab" x="24" y="250">STACK</text>
  <text class="stk" x="24" y="268">Full Stack Development &#183; Python &#183; APIs</text>
  <text class="stk" x="24" y="286">Databases &#183; RAG &#183; LLMs</text>
</svg>

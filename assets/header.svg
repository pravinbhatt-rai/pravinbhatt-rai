<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Pravin Bhattarai. Software Engineer, Full Stack Developer, AI and LLM Engineer. Building intelligent systems, engineering scalable products, turning ideas into reality.">
  <title>Pravin Bhattarai</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a13"/>
      <stop offset=".55" stop-color="#0c1226"/>
      <stop offset="1" stop-color="#140b2e"/>
    </linearGradient>
    <linearGradient id="nm" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00f7ff"/>
      <stop offset=".5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.6 0;0.6 0;-0.6 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f7ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#00f7ff" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="gm"><rect width="900" height="320" fill="url(#vig)"/></mask>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f7ff" stroke-opacity=".12"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="5s" repeatCount="indefinite"/>
    </pattern>
    <filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="gl" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="rc"><rect width="900" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    text{font-family:'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
    .lbl{font-size:12px;letter-spacing:3px;fill:#00f7ff;fill-opacity:.8}
    .lbl2{font-size:12px;letter-spacing:3px;fill:#7a8aa8}
    .glow,.name{font-size:52px;font-weight:800;letter-spacing:4px}
    .glow{fill:url(#nm);opacity:0;animation:glowin 1s ease 2.2s forwards,breathe 3s ease-in-out 3.2s infinite alternate}
    .name{fill:url(#nm);stroke:url(#nm);stroke-width:1.4;stroke-dasharray:700;stroke-dashoffset:700;fill-opacity:0;animation:draw 2.2s ease-out .2s forwards,fillin 1s ease-in 2s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes fillin{to{fill-opacity:1;stroke-opacity:0}}
    @keyframes glowin{to{opacity:.55}}
    @keyframes breathe{from{opacity:.55}to{opacity:.25}}
    .role{font-size:24px;opacity:0;animation:role 15s ease-in-out infinite both}
    @keyframes role{0%{opacity:0;transform:translateY(12px)}3%{opacity:1;transform:translateY(0)}17%{opacity:1;transform:translateY(0)}20%{opacity:0;transform:translateY(-12px)}100%{opacity:0;transform:translateY(-12px)}}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{fill-opacity:0}}
    .tag{font-size:14px;fill:#9fb0cf;opacity:0;animation:fadein 1.4s ease 3s forwards}
    @keyframes fadein{to{opacity:1}}
    .p{opacity:0;animation:rise 8s linear infinite}
    @keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.85}90%{opacity:.5}100%{transform:translateY(-350px);opacity:0}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.25}}
  </style>

  <g clip-path="url(#rc)">
    <rect width="900" height="320" fill="url(#bg)"/>

    <circle cx="170" cy="90" r="110" fill="#00f7ff" opacity=".16" filter="url(#bl)">
      <animate attributeName="cx" values="170;300;170" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;150;90" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="220" r="130" fill="#7c5cff" opacity=".22" filter="url(#bl)">
      <animate attributeName="cx" values="740;600;740" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="220;120;220" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="40" r="80" fill="#ff4fd8" opacity=".12" filter="url(#bl)">
      <animate attributeName="cx" values="480;580;480" dur="10s" repeatCount="indefinite"/>
    </circle>

    <rect width="900" height="320" fill="url(#grid)" mask="url(#gm)"/>

    <circle class="p" cx="60" cy="330" r="2" style="fill:#00f7ff;animation-duration:7s;animation-delay:-1s"/>
    <circle class="p" cx="130" cy="330" r="1.5" style="fill:#ff4fd8;animation-duration:9s;animation-delay:-4s"/>
    <circle class="p" cx="205" cy="330" r="2.5" style="fill:#7c5cff;animation-duration:8s;animation-delay:-2s"/>
    <circle class="p" cx="275" cy="330" r="1.5" style="fill:#00f7ff;animation-duration:10s;animation-delay:-6s"/>
    <circle class="p" cx="340" cy="330" r="2" style="fill:#3dffa0;animation-duration:7s;animation-delay:-3s"/>
    <circle class="p" cx="410" cy="330" r="1.5" style="fill:#ff4fd8;animation-duration:11s;animation-delay:-8s"/>
    <circle class="p" cx="480" cy="330" r="2.5" style="fill:#00f7ff;animation-duration:8s;animation-delay:-5s"/>
    <circle class="p" cx="545" cy="330" r="1.5" style="fill:#7c5cff;animation-duration:9s;animation-delay:-1s"/>
    <circle class="p" cx="615" cy="330" r="2" style="fill:#00f7ff;animation-duration:7s;animation-delay:-6s"/>
    <circle class="p" cx="680" cy="330" r="1.5" style="fill:#3dffa0;animation-duration:10s;animation-delay:-3s"/>
    <circle class="p" cx="750" cy="330" r="2.5" style="fill:#ff4fd8;animation-duration:8s;animation-delay:-7s"/>
    <circle class="p" cx="815" cy="330" r="2" style="fill:#00f7ff;animation-duration:9s;animation-delay:-2s"/>
    <circle class="p" cx="860" cy="330" r="1.5" style="fill:#7c5cff;animation-duration:11s;animation-delay:-9s"/>
    <circle class="p" cx="25" cy="330" r="2" style="fill:#3dffa0;animation-duration:8s;animation-delay:-5s"/>

    <rect width="900" height="2" fill="#00f7ff" opacity=".25">
      <animate attributeName="y" values="-4;322" dur="6s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(86 160)">
      <circle r="56" fill="none" stroke="#00f7ff" stroke-opacity=".5" stroke-dasharray="3 9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle r="38" fill="none" stroke="#7c5cff" stroke-opacity=".7" stroke-dasharray="14 8">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle r="4" fill="#00f7ff" class="pulse"/>
    </g>
    <g transform="translate(814 160)">
      <circle r="56" fill="none" stroke="#ff4fd8" stroke-opacity=".45" stroke-dasharray="3 9">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle r="38" fill="none" stroke="#00f7ff" stroke-opacity=".7" stroke-dasharray="14 8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle r="4" fill="#ff4fd8" class="pulse"/>
    </g>

    <path d="M20 58V30Q20 20 30 20H58" fill="none" stroke="#00f7ff" stroke-width="2" class="pulse"/>
    <path d="M880 58V30Q880 20 870 20H842" fill="none" stroke="#00f7ff" stroke-width="2" class="pulse"/>

    <text class="lbl" x="40" y="44">// PORTFOLIO &#183; 2026</text>
    <text class="lbl2" x="860" y="44" text-anchor="end">SOFTWARE &#183; AI &#183; BACKEND</text>

    <text class="glow" x="450" y="152" text-anchor="middle" filter="url(#gl)">PRAVIN BHATTARAI</text>
    <text class="name" x="450" y="152" text-anchor="middle">PRAVIN BHATTARAI</text>

    <text class="role" x="450" y="205" text-anchor="middle" style="animation-delay:2s"><tspan fill="#00f7ff">&gt; </tspan><tspan fill="#e6f1ff">Software Engineer</tspan><tspan class="cur" fill="#00f7ff">|</tspan></text>
    <text class="role" x="450" y="205" text-anchor="middle" style="animation-delay:5s"><tspan fill="#00f7ff">&gt; </tspan><tspan fill="#e6f1ff">Full Stack Developer</tspan><tspan class="cur" fill="#00f7ff">|</tspan></text>
    <text class="role" x="450" y="205" text-anchor="middle" style="animation-delay:8s"><tspan fill="#00f7ff">&gt; </tspan><tspan fill="#e6f1ff">AI / LLM Engineer</tspan><tspan class="cur" fill="#00f7ff">|</tspan></text>
    <text class="role" x="450" y="205" text-anchor="middle" style="animation-delay:11s"><tspan fill="#00f7ff">&gt; </tspan><tspan fill="#e6f1ff">Backend &amp; Systems Developer</tspan><tspan class="cur" fill="#00f7ff">|</tspan></text>
    <text class="role" x="450" y="205" text-anchor="middle" style="animation-delay:14s"><tspan fill="#00f7ff">&gt; </tspan><tspan fill="#e6f1ff">Building Intelligent Digital Products</tspan><tspan class="cur" fill="#00f7ff">|</tspan></text>

    <text class="tag" x="450" y="250" text-anchor="middle">Building intelligent systems. Engineering scalable products. Turning ideas into reality.</text>

    <path fill="url(#w2)" d="M0,292 C150,312 300,272 450,292 S750,312 900,292 L900,320 L0,320 Z">
      <animate attributeName="d" dur="9s" repeatCount="indefinite" values="M0,292 C150,312 300,272 450,292 S750,312 900,292 L900,320 L0,320 Z;M0,292 C150,272 300,312 450,292 S750,272 900,292 L900,320 L0,320 Z;M0,292 C150,312 300,272 450,292 S750,312 900,292 L900,320 L0,320 Z"/>
    </path>
    <path fill="url(#w1)" d="M0,298 C150,278 300,318 450,298 S750,278 900,298 L900,320 L0,320 Z">
      <animate attributeName="d" dur="7s" repeatCount="indefinite" values="M0,298 C150,278 300,318 450,298 S750,278 900,298 L900,320 L0,320 Z;M0,298 C150,318 300,278 450,298 S750,318 900,298 L900,320 L0,320 Z;M0,298 C150,278 300,318 450,298 S750,278 900,298 L900,320 L0,320 Z"/>
    </path>
  </g>
  <rect x=".5" y=".5" width="899" height="319" rx="18" fill="none" stroke="#1c2740"/>
</svg>

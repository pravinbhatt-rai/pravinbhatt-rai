<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" role="img" aria-label="Professional experience">
  <title>Professional experience</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f7ff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f7ff" stop-opacity="0"/><stop offset=".5" stop-color="#00f7ff" stop-opacity=".3"/><stop offset="1" stop-color="#00f7ff" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="900" height="64" rx="12"/></clipPath>
  </defs>
  <style>
    text{font-family:'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
    .t{font-size:22px;font-weight:700;letter-spacing:3px;fill:#e6f1ff;clip-path:inset(0 100% 0 0);animation:type 1.6s steps(23,end) .3s forwards}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
    .tag{font-size:12px;fill:#7a8aa8;letter-spacing:1px}
    .sweep{animation:sweep 4s ease-in-out infinite}
    @keyframes sweep{from{transform:translateX(0)}to{transform:translateX(1060px)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
    @keyframes spin{from{transform:rotate(45deg)}to{transform:rotate(405deg)}}
    .pulse{animation:pulse 1.6s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.25}}
    .draw{stroke-dasharray:852;stroke-dashoffset:852;animation:draw 1.6s ease-out .2s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
  </style>
  <rect width="900" height="64" rx="12" fill="#0a0e17"/>
  <g clip-path="url(#c)"><rect class="sweep" x="-160" width="160" height="64" fill="url(#sh)"/></g>
  <rect x=".5" y=".5" width="899" height="63" rx="12" fill="none" stroke="#1c2740"/>
  <g transform="translate(36 30)"><rect class="spin" x="-9" y="-9" width="18" height="18" fill="none" stroke="#00f7ff" stroke-width="2"/><rect x="-3" y="-3" width="6" height="6" fill="#00f7ff" class="pulse"/></g>
  <text class="t" x="64" y="38">PROFESSIONAL EXPERIENCE</text>
  <text class="tag" x="864" y="36" text-anchor="end">~/pravin/experience</text>
  <line class="draw" x1="24" y1="60" x2="876" y2="60" stroke="url(#g)" stroke-width="2"/>
  <circle r="3" cy="60" fill="#fff"><animateMotion dur="4s" repeatCount="indefinite" path="M24 0 L876 0"/></circle>
</svg>

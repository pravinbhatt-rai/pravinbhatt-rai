  <style>
    text{font-family:'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
    #r1 text,#r2 text,#r3 text,#r4 text{font-size:13px;fill:#e6f1ff;text-anchor:middle}
    .lab{font-size:11px;letter-spacing:3px;fill:#7a8aa8}
    .m1{animation:l1 42s linear infinite}
    .m2{animation:r2 42s linear infinite}
    .m3{animation:l3 52s linear infinite}
    .m4{animation:r4 42s linear infinite}
    @keyframes l1{to{transform:translateX(-1892px)}}
    @keyframes r2{from{transform:translateX(-1892px)}to{transform:translateX(0)}}
    @keyframes l3{to{transform:translateX(-2236px)}}
    @keyframes r4{from{transform:translateX(-1892px)}to{transform:translateX(0)}}
    .pulse{animation:pulse 1.6s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.2}}
  </style>

